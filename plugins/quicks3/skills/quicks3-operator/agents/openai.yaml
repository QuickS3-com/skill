interface:
  display_name: "QuickS3 Operator"
  short_description: "Browse, transfer, and share QuickS3 files safely"
  default_prompt: "Use $quicks3-operator to list the folders I can access without recursing into them."
dependencies:
  tools:
    - type: "mcp"
      value: "QuickS3"
      description: "QuickS3 object-storage access"
      transport: "streamable_http"
      url: "https://quicks3.com/mcp"
policy:
  allow_implicit_invocation: true
